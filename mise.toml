[settings]
lockfile = true
npm.package_manager = "pnpm"

[tools]
node = "26.8.1"
pnpm = "11.25.0"
vale = "3.15.1"

[tasks.clean]
run = [
  "git clean -dfX"
]

# Bare `mise lock` only refreshes platforms already present in mise.lock, so a
# newly added tool records no URLs at all and CI's `mise install --locked`
# fails on linux-x64. Always lock through this task.
[tasks.lock]
run = [
  "mise lock -p linux-x64,linux-arm64,macos-arm64"
]

[tasks.install]
run = [
  "mise install",
  "mise exec -- pnpm i --frozen-lockfile --prefer-offline",
  "mise exec -- vale sync",
]

[tasks.setup]
run = [
  "mise run clean",
  "mise run install",
  "pnpm run ci",
]
