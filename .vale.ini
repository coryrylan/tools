# Repo-level prose lint, consuming the starter kit this package ships from
# source (consumers use node_modules/@coryrylan/tools/dist/vale instead).
# Run `vale sync` once to download the Google and write-good packages.
StylesPath = projects/tools/src/vale/styles
MinAlertLevel = warning
Vocab = Tools
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good
TokenIgnores = (\{%[\s\S]*?%\}), (\{\{[^}]*\}\})
Vale.Terms = NO
Google.Headings = NO
Google.WordList = NO
; Spaced em dashes, `e.g.`/`i.e.`, and logical quote punctuation
; (periods outside quotation marks) are the house style.
Google.EmDash = NO
Google.Latin = NO
Google.Quotes = NO
