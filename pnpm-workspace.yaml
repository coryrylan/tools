packages:
  - 'projects/*'
allowBuilds:
  # Type-only transitive devDependencies of @earendil-works/pi-ai; their
  # postinstall scripts are unnecessary for typechecking and stay disabled.
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.4'
  - '@earendil-works/pi-ai@0.84.4'
  - '@earendil-works/pi-client@0.84.4'
  - '@earendil-works/pi-coding-agent@0.84.4'
  - '@earendil-works/pi-protocol@0.84.4'
  - '@earendil-works/pi-telemetry@0.84.4'
  - '@earendil-works/pi-tui@0.84.4'
  - '@nvidia-elements/core@2.6.0'
  - typebox@1.3.22
