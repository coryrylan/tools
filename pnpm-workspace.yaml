packages:
  - 'projects/*'
allowBuilds:
  # Type-only transitive devDependencies of @earendil-works/pi-ai; their
  # postinstall scripts are unnecessary for typechecking and stay disabled.
  '@google/genai': false
  protobufjs: false
  # esbuild uses its optional platform binary without postinstall.
  esbuild: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.2'
  - '@earendil-works/pi-agent-core@1.0.2'
  - '@earendil-works/pi-ai@1.0.2'
  - '@earendil-works/pi-client@1.0.2'
  - '@earendil-works/pi-codemode@1.0.2'
  - '@earendil-works/pi-coding-agent@1.0.2'
  - '@earendil-works/pi-mcp@1.0.2'
  - '@earendil-works/pi-protocol@1.0.2'
  - '@earendil-works/pi-telemetry@1.0.2'
  - '@earendil-works/pi-tui@1.0.2'
  - '@nvidia-elements/core@2.6.0'
  - typebox@1.3.22
