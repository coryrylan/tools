name: Build
on: pull_request

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - run: pnpm run ci
      - name: Verify only dist, CHANGELOG, LICENSE, README, and package.json are published
        run: |
          cd projects/lib
          pnpm pack --out /tmp/tools.tgz
          if tar -tzf /tmp/tools.tgz | grep -vE '^package/(dist/|LICENSE$|README\.md$|CHANGELOG\.md$|package\.json$)'; then
            echo 'Unexpected files in the published tarball (listed above).'
            exit 1
          fi
