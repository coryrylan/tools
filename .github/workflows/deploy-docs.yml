name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      # The docs site renders rule docs sourced from projects/lib, so lib
      # changes must redeploy the site too.
      - 'projects/docs/**'
      - 'projects/lib/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - run: pnpm -F docs run build
        env:
          PAGES_BASE_URL: /tools/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
